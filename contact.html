<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Gift Me Fancy</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><div id="site-header"></div>
<main>
<section class="page-hero"><div class="container"><span class="eyebrow">LET'S CONNECT</span><h1>Contact <span>Gift Me Fancy.</span></h1><p>Questions, custom gifting, product enquiries or just want to say hello? We'd love to hear from you.</p></div></section>
<section class="section"><div class="container contact-layout">
  <div class="contact-panel"><span class="eyebrow">CONTACT DETAILS</span><h2>Let's make something <span>fancy.</span></h2>
    <div class="contact-detail"><b>WhatsApp</b><a href="https://wa.me/27837609276" target="_blank" rel="noopener">083 760 9276</a></div>
    <div class="contact-detail"><b>Email</b><a href="mailto:hello@giftmefancy.com">hello@giftmefancy.com</a></div>
    <div class="contact-detail"><b>Location</b><span>Durban, South Africa</span></div>
  </div>
  <form class="glass-form" id="contact-form">
    <label>Name<input name="name" required></label>
    <label>Email<input type="email" name="email" required></label>
    <label>WhatsApp / Phone<input name="phone"></label>
    <label>How can we help?<textarea name="message" rows="6" required></textarea></label>
    <button class="btn btn-dark" type="submit">Send via WhatsApp →</button>
  </form>
</div></section>
</main><div id="site-footer"></div>
<script src="assets/js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{GFM.renderHeader();GFM.renderFooter();GFM.bindContactForm();});</script>
</body></html>
